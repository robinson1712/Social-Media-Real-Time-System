server:
  port: 8085
spring:
  application:
    name: comment-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/comment_db
    username: ${DB_USER:sma}
    password: ${DB_PASSWORD:sma}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: comment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.socialapp.common.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$NotFound
    instances:
      post-service:
        base-config: default

---
# Supabase (cloud Postgres) - enabled with SPRING_PROFILES_ACTIVE=supabase.
# Supabase provides a single "postgres" database, so this service keeps its
# tables in its own schema (comment_db) instead of a separate database.
# Connects through the Supavisor transaction pooler (IPv4-friendly), which
# does not support server-side prepared statements -> prepareThreshold=0.
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:6543}/postgres?sslmode=require&prepareThreshold=0
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      # 10 services share the free-tier connection budget.
      maximum-pool-size: ${SUPABASE_DB_POOL_SIZE:3}
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        default_schema: comment_db
        hbm2ddl:
          create_namespaces: true
