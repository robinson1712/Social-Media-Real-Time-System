server:
  port: 8083
spring:
  application:
    name: media-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/media_db
    username: ${DB_USER:sma}
    password: ${DB_PASSWORD:sma}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
minio:
  internal-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: social-media

---
# Supabase (cloud Postgres) - enabled with SPRING_PROFILES_ACTIVE=supabase.
# Supabase provides a single "postgres" database, so this service keeps its
# tables in its own schema (media_db) instead of a separate database.
# Connects through the Supavisor transaction pooler (IPv4-friendly), which
# does not support server-side prepared statements -> prepareThreshold=0.
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:6543}/postgres?sslmode=require&prepareThreshold=0
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      # 10 services share the free-tier connection budget.
      maximum-pool-size: ${SUPABASE_DB_POOL_SIZE:3}
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        default_schema: media_db
        hbm2ddl:
          create_namespaces: true
