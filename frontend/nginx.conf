server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This app has no versioned/hashed asset filenames (main.dart.js, the
    # bootstrap/service-worker files, canvaskit, everything under assets/
    # all keep the exact same URL across deploys), so without this,
    # browsers can and do keep serving a stale copy of any of them
    # indefinitely via heuristic caching — even on a plain reload, since
    # there's no Cache-Control telling them not to. Blanket no-cache is the
    # only way a deploy reliably shows up; this is a small internal app, not
    # a CDN-fronted site, so the lost caching benefit doesn't matter.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
