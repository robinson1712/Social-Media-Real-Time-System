server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/api/media/**
        - id: post-service
          uri: lb://POST-SERVICE
          predicates:
            - Path=/api/posts/**
        - id: comment-service
          uri: lb://COMMENT-SERVICE
          predicates:
            - Path=/api/comments/**
        - id: reaction-service
          uri: lb://REACTION-SERVICE
          predicates:
            - Path=/api/reactions/**
        - id: story-service
          uri: lb://STORY-SERVICE
          predicates:
            - Path=/api/stories/**
        - id: reels-service
          uri: lb://REELS-SERVICE
          predicates:
            - Path=/api/reels/**
        - id: group-service
          uri: lb://GROUP-SERVICE
          predicates:
            - Path=/api/groups/**
        - id: fanpage-service
          uri: lb://FANPAGE-SERVICE
          predicates:
            - Path=/api/pages/**
        - id: dating-service
          uri: lb://DATING-SERVICE
          predicates:
            - Path=/api/dating/**
        - id: chat-service-ws
          uri: lb:ws://CHAT-SERVICE
          predicates:
            - Path=/ws/**
        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/api/chat/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
        - id: feed-service
          uri: lb://FEED-SERVICE
          predicates:
            - Path=/api/feed/**

jwt:
  secret: ${JWT_SECRET:change-this-social-app-jwt-secret-key-must-be-at-least-256-bits}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
